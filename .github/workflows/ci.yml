name: verify

on:
  push:
  pull_request:

# 最小权限：工作流只需要读取仓库内容。
# 外部 fork 的 PR 默认拿不到仓库 secrets；本工作流也不读取任何 secrets。
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check, build, content tests and link check
        run: npm run verify
